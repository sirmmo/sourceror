name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Offline test suite
        # No network: the suite must never depend on the live wikis.
        run: python -m pytest tests/test_offline.py -q

      - name: Byte-compile every module
        run: python -m compileall -q app.py sourceror

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sourceror:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the app and probe it
        run: |
          docker run -d --name sourceror -p 5000:5000 sourceror:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null 2>&1; then
              echo "app is up"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/ >/dev/null
          curl -fsS http://127.0.0.1:5000/api/llm | grep -q llm_base_url
          echo "smoke probes passed"

      - name: Container logs on failure
        if: failure()
        run: docker logs sourceror || true
