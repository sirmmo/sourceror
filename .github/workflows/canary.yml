name: Upstream canary

# Sourceror parses the wikitext of WP:RSP and the JavaScript of
# User:Headbomb/unreliable.js. Both are community-maintained pages that can be
# restructured at any time. If that happens the parsers return nothing, the
# knowledge base goes empty, and every source silently looks clean — a false
# negative is far worse here than a crash. This job checks weekly and opens an
# issue when the live data stops parsing.

on:
  schedule:
    - cron: "17 6 * * 1"      # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Live smoke test against the real APIs
        id: smoke
        run: |
          set -o pipefail
          python tests/smoke.py 2>&1 | tee smoke.log

      - name: Open an issue when upstream parsing breaks
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label upstream-drift --state open \
                       --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file - <<EOF
          The upstream canary failed again on $(date -u +%Y-%m-%d).

          \`\`\`
          $(tail -40 smoke.log)
          \`\`\`

          [Run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
          else
            gh label create upstream-drift --color d93f0b \
              --description "A source Sourceror parses changed upstream" 2>/dev/null || true
            gh issue create --label upstream-drift \
              --title "Upstream data no longer parses ($(date -u +%Y-%m-%d))" \
              --body-file - <<EOF
          The weekly canary failed, which usually means one of the sources
          Sourceror parses has changed shape:

          - \`Wikipedia:Reliable sources/Perennial sources/1..8\` — the table row
            format (\`|- class="s-XX" id="…"\`, \`{{WP:RSPSTATUS}}\`, \`{{WP:RSPUSES}}\`)
          - \`User:Headbomb/unreliable.js\` — the \`var rules = [{comment, regex, css}]\` array
          - Crossref / OpenAlex / Citoid / Wayback response shapes

          Until it is fixed the knowledge base may be empty, and an empty
          knowledge base makes every source look clean.

          \`\`\`
          $(tail -40 smoke.log)
          \`\`\`

          [Run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
          fi

      - name: Close the issue once upstream parses again
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label upstream-drift --state open \
                       --json number -q '.[].number'); do
            gh issue comment "$n" --body "Canary passed on $(date -u +%Y-%m-%d); upstream parses again. Closing."
            gh issue close "$n"
          done
