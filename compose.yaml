services:
  sourceror:
    build: .
    image: sourceror:latest
    container_name: sourceror
    ports:
      # Loopback by default. Sourceror has no authentication, and /api/llm lets
      # a caller repoint the LLM endpoint — so an exposed port would let anyone
      # redirect your API key to a server of their choosing. Put it behind a
      # reverse proxy with auth before setting BIND=0.0.0.0.
      - "${BIND:-127.0.0.1}:${PORT:-5010}:5000"
    environment:
      SOURCEROR_LANG: "${SOURCEROR_LANG:-it}"
      SOURCEROR_CONTACT: "${SOURCEROR_CONTACT:-}"
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
    volumes:
      # Live-reload the source, and keep the reliability cache across restarts.
      - ./sourceror:/app/sourceror:ro
      - ./templates:/app/templates:ro
      - ./app.py:/app/app.py:ro
      - sourceror-data:/app/data
    restart: unless-stopped

volumes:
  sourceror-data:
